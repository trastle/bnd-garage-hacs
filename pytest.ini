[pytest]
asyncio_mode = auto
# Makes `custom_components` importable as a namespace package regardless of
# how pytest is invoked - needed by tests/components/, which imports things
# like `from custom_components.bnd_smart_hub.const import DOMAIN` at collection
# time. `python -m pytest` adds the CWD to sys.path automatically, which is
# why this worked locally without it; the bare `pytest` console script (what
# CI actually runs) does not, and fails with "No module named
# 'custom_components'" without this.
pythonpath = .
